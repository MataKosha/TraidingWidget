<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Trading Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="widget">
    <div class="header">
      <span class="pair" id="pairText">USD/INR OTC</span>
      <span class="time" id="clock">00:00:00 UTC+5</span>
    </div>
    
    <div class="title">LIVE TRADES</div>

    <div class="grid">
      <div class="stat-block">
        <div class="counter-label">WIN</div>
        <div class="val-win" id="wins">0</div>
        <div class="btns">
          <button class="btn btn-win" onclick="addWin(1)">+</button>
          <button class="btn btn-win btn-minus" onclick="addWin(-1)">-</button>
        </div>
      </div>
      
      <div class="stat-block">
        <div class="counter-label">LOSS</div>
        <div class="val-loss" id="losses">0</div>
        <div class="btns">
          <button class="btn btn-loss" onclick="addLoss(1)">+</button>
          <button class="btn btn-loss btn-minus" onclick="addLoss(-1)">-</button>
        </div>
      </div>
    </div>

    <div class="winrate-bar" id="wrText">Winrate: 0.0% (0/0)</div>

    <div class="footer">
      <span class="footer-btn" onclick="resetStats()">⚙ Сброс</span>
      <span class="footer-btn" onclick="openModal()">⚙ Настройки</span>
    </div>

    <!-- Модальное окно выбора пар -->
    <div class="modal" id="pairModal">
      <div class="modal-header">
        <span>Выберите пару</span>
        <span class="close-btn" onclick="closeModal()">&times;</span>
      </div>
      <div class="pairs-grid">
  <button class="pair-option" onclick="selectPair('EUR/USD OTC')">EUR/USD OTC</button>
  <button class="pair-option" onclick="selectPair('GBP/USD OTC')">GBP/USD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/JPY OTC')">USD/JPY OTC</button>
  <button class="pair-option" onclick="selectPair('EUR/JPY OTC')">EUR/JPY OTC</button>
  <button class="pair-option" onclick="selectPair('AUD/USD OTC')">AUD/USD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/CAD OTC')">USD/CAD OTC</button>
  <button class="pair-option" onclick="selectPair('NZD/USD OTC')">NZD/USD OTC</button>
  <button class="pair-option" onclick="selectPair('GBP/JPY OTC')">GBP/JPY OTC</button>
  <button class="pair-option" onclick="selectPair('USD/CHF OTC')">USD/CHF OTC</button>
  <button class="pair-option" onclick="selectPair('CHF/JPY OTC')">CHF/JPY OTC</button>
  <button class="pair-option" onclick="selectPair('EUR/GBP OTC')">EUR/GBP OTC</button>
  <button class="pair-option" onclick="selectPair('CAD/JPY OTC')">CAD/JPY OTC</button>
  <button class="pair-option" onclick="selectPair('AED/CNY OTC')">AED/CNY OTC</button>
  <button class="pair-option" onclick="selectPair('AUD/CAD OTC')">AUD/CAD OTC</button>
  <button class="pair-option" onclick="selectPair('CAD/CHF OTC')">CAD/CHF OTC</button>
  <button class="pair-option" onclick="selectPair('GBP/AUD OTC')">GBP/AUD OTC</button>
  <button class="pair-option" onclick="selectPair('MAD/USD OTC')">MAD/USD OTC</button>
  <button class="pair-option" onclick="selectPair('OMR/CNY OTC')">OMR/CNY OTC</button>
  <button class="pair-option" onclick="selectPair('SAR/CNY OTC')">SAR/CNY OTC</button>
  <button class="pair-option" onclick="selectPair('USD/CNH OTC')">USD/CNH OTC</button>
  <button class="pair-option" onclick="selectPair('USD/DZD OTC')">USD/DZD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/PHP OTC')">USD/PHP OTC</button>
  <button class="pair-option" onclick="selectPair('USD/SGD OTC')">USD/SGD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/THB OTC')">USD/THB OTC</button>
  <button class="pair-option" onclick="selectPair('YER/USD OTC')">YER/USD OTC</button>
  <button class="pair-option" onclick="selectPair('CHF/NOK OTC')">CHF/NOK OTC</button>
  <button class="pair-option" onclick="selectPair('USD/INR OTC')">USD/INR OTC</button>
  <button class="pair-option" onclick="selectPair('AUD/JPY OTC')">AUD/JPY OTC</button>
  <button class="pair-option" onclick="selectPair('USD/RUB OTC')">USD/RUB OTC</button>
  <button class="pair-option" onclick="selectPair('BHD/CNY OTC')">BHD/CNY OTC</button>
  <button class="pair-option" onclick="selectPair('USD/ARS OTC')">USD/ARS OTC</button>
  <button class="pair-option" onclick="selectPair('EUR/RUB OTC')">EUR/RUB OTC</button>
  <button class="pair-option" onclick="selectPair('EUR/CHF OTC')">EUR/CHF OTC</button>
  <button class="pair-option" onclick="selectPair('AUD/NZD OTC')">AUD/NZD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/EGP OTC')">USD/EGP OTC</button>
  <button class="pair-option" onclick="selectPair('ZAR/USD OTC')">ZAR/USD OTC</button>
  <button class="pair-option" onclick="selectPair('NGN/USD OTC')">NGN/USD OTC</button>
  <button class="pair-option" onclick="selectPair('QAR/CNY OTC')">QAR/CNY OTC</button>
  <button class="pair-option" onclick="selectPair('LBP/USD OTC')">LBP/USD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/PKR OTC')">USD/PKR OTC</button>
  <button class="pair-option" onclick="selectPair('AUD/CHF OTC')">AUD/CHF OTC</button>
  <button class="pair-option" onclick="selectPair('TND/USD OTC')">TND/USD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/COP OTC')">USD/COP OTC</button>
  <button class="pair-option" onclick="selectPair('USD/BDT OTC')">USD/BDT OTC</button>
  <button class="pair-option" onclick="selectPair('EUR/HUF OTC')">EUR/HUF OTC</button>
  <button class="pair-option" onclick="selectPair('USD/MXN OTC')">USD/MXN OTC</button>
  <button class="pair-option" onclick="selectPair('USD/VND OTC')">USD/VND OTC</button>
  <button class="pair-option" onclick="selectPair('KES/USD OTC')">KES/USD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/BRL OTC')">USD/BRL OTC</button>
  <button class="pair-option" onclick="selectPair('USD/CLP OTC')">USD/CLP OTC</button>
  <button class="pair-option" onclick="selectPair('EUR/NZD OTC')">EUR/NZD OTC</button>
  <button class="pair-option" onclick="selectPair('EUR/TRY OTC')">EUR/TRY OTC</button>
  <button class="pair-option" onclick="selectPair('NZD/JPY OTC')">NZD/JPY OTC</button>
  <button class="pair-option" onclick="selectPair('JOD/CNY OTC')">JOD/CNY OTC</button>
  <button class="pair-option" onclick="selectPair('USD/MYR OTC')">USD/MYR OTC</button>
  <button class="pair-option" onclick="selectPair('UAH/USD OTC')">UAH/USD OTC</button>
  <button class="pair-option" onclick="selectPair('USD/IDR OTC')">USD/IDR OTC</button>
</div>
      <div class="custom-input-group">
        <input type="text" id="customPairInput" placeholder="Своя пара...">
        <button onclick="applyCustomPair()">ОК</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
