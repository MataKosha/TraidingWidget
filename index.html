<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="widget">
    <div class="header">
      <span class="pair" id="pairText">USD/INR OTC</span>
      <span class="time" id="clock">00:00:00 UTC+5</span>
    </div>
    
    <div class="title">LIVE TRADES</div>

    <div class="grid">
      <div class="stat-block">
        <div class="counter-label">WIN</div>
        <div class="val-win" id="wins">0</div>
        <div class="btns">
          <button class="btn btn-win" onclick="addWin(1)">+</button>
          <button class="btn btn-win btn-minus" onclick="addWin(-1)">-</button>
        </div>
      </div>
      
      <div class="stat-block">
        <div class="counter-label">LOSS</div>
        <div class="val-loss" id="losses">0</div>
        <div class="btns">
          <button class="btn btn-loss" onclick="addLoss(1)">+</button>
          <button class="btn btn-loss btn-minus" onclick="addLoss(-1)">-</button>
        </div>
      </div>
    </div>

    <div class="winrate-bar" id="wrText">Winrate: 0.0% (0/0)</div>

    <div class="footer">
      <span class="footer-btn" onclick="resetStats()">⚙ Сброс</span>
      <span class="footer-btn" onclick="openModal()">⚙ Настройки</span>
    </div>

    <!-- Модальное окно выбора пар -->
    <div class="modal" id="pairModal">
      <div class="modal-header">
        <span>Выберите пару</span>
        <span class="close-btn" onclick="closeModal()">&times;</span>
      </div>
      <div class="pairs-grid">
        <button class="pair-option" onclick="selectPair('USD/INR OTC')">USD/INR OTC</button>
        <button class="pair-option" onclick="selectPair('EUR/USD OTC')">EUR/USD OTC</button>
        <button class="pair-option" onclick="selectPair('GBP/USD OTC')">GBP/USD OTC</button>
        <button class="pair-option" onclick="selectPair('USD/BDT OTC')">USD/BDT OTC</button>
        <button class="pair-option" onclick="selectPair('USD/BRL OTC')">USD/BRL OTC</button>
        <button class="pair-option" onclick="selectPair('USD/PKR OTC')">USD/PKR OTC</button>
        <button class="pair-option" onclick="selectPair('BTC/USDT')">BTC/USDT</button>
        <button class="pair-option" onclick="selectPair('ETH/USDT')">ETH/USDT</button>
      </div>
      <div class="custom-input-group">
        <input type="text" id="customPairInput" placeholder="Своя пара...">
        <button onclick="applyCustomPair()">ОК</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
